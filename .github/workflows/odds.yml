name: Refresh odds
on:
  schedule: [{ cron: "0 */3 * * *" }]
  workflow_dispatch:
  push: { paths: ["scripts/**"] }
permissions: { contents: write }
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build_odds.mjs
      - run: |
          git config user.name "odds-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/odds.json
          git diff --cached --quiet || (git commit -m "Refresh odds" && git pull -q --rebase && git push)
